<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P02L — Управление</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding: 32px 24px 64px; }
  .wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .wrap > .app-header { margin-bottom: 0; }
  .name-field { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--cream-dim); }
  .name-field input { width: min(220px, 60vw); height: 40px; font-weight: 600; border-color: var(--line); background: var(--surface); }

  .timer-card { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .timer-clock { font-family: var(--font-display); font-size: 56px; font-weight: 700; line-height: 1; min-width: 210px; }
  .timer-info { flex: 1 1 260px; display: flex; flex-direction: column; gap: 6px; }
  .timer-state { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--cream-dim); }
  .timer-level { font-size: 20px; font-weight: 600; }
  .timer-next { font-size: 14px; color: var(--cream-faint); }
  .timer-btns { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .timer-btns .pill-btn.main { min-width: 140px; }
  .timer-extra { flex: 1 1 100%; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--line); }
  .timer-extra input[type=text] { height: 36px; padding: 0 10px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--line); color: var(--cream); }

  .tab-body { display: flex; flex-direction: column; gap: 16px; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--cream-dim); }
  .grid-auto { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
  .actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 16px; }

  .table-card { padding: 12px 16px 16px; overflow-x: auto; }
  .lv-grid { min-width: 720px; display: grid; grid-template-columns: 48px repeat(3, minmax(0, 1fr)) 96px 132px; gap: 10px; align-items: center; }
  .lv-head { padding: 8px; font-size: 12px; letter-spacing: .12em; color: var(--cream-faint); }
  .lv-row { padding: 6px 8px; border-radius: 14px; }
  .lv-row.break { background: #1a1814; }
  .lv-row.current { background: var(--gold-soft); box-shadow: inset 0 0 0 1px var(--gold); }
  .lv-num { font-size: 15px; color: var(--cream-dim); padding-left: 4px; }
  .lv-break-icon { display: flex; align-items: center; padding-left: 4px; color: var(--gold); }
  .lv-break-label { grid-column: span 3; font-size: 15px; color: var(--gold); font-weight: 500; }
  .lv-tools { display: flex; gap: 4px; justify-content: flex-end; }
  .lv-add { display: flex; gap: 8px; padding: 12px 8px 0; flex-wrap: wrap; }

  .cash-status { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .cash-status .text { flex: 1 1 280px; display: flex; flex-direction: column; gap: 4px; }
  .cash-status .title { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; }
  .cash-status .title .dot { width: 10px; height: 10px; }
  .tariff-card { overflow-x: auto; }
  .tf-grid { min-width: 640px; display: grid; grid-template-columns: minmax(0, 2fr) repeat(2, minmax(0, 1fr)) 140px; gap: 10px; align-items: center; }
  .tf-head { font-size: 12px; letter-spacing: .12em; color: var(--cream-faint); margin: 4px 0 8px; }
  .tf-row { margin-bottom: 10px; }
  .tf-side { display: flex; justify-content: flex-end; }
  .sold-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--cream-dim); background: var(--surface2); border-radius: 999px; padding: 6px 12px; }
  .sold-pill svg.ic { width: 14px; height: 14px; }
  .rake-card { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .rake-card .field { width: 160px; }
  .rake-card .calc { flex: 1 1 300px; font-size: 14px; line-height: 1.5; color: var(--cream-dim); }
  .rake-card .calc b { color: var(--cream); font-weight: 600; }
  .rake-card .calc b.gold { color: var(--gold); }

  .prize-layout { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .prize-left { flex: 1 1 320px; display: flex; flex-direction: column; gap: 16px; }
  .prize-right { flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .fund-val { font-family: var(--font-display); font-size: 36px; font-weight: 700; color: var(--gold); }
  .place-row { display: grid; grid-template-columns: 88px minmax(0, 1fr) 64px 120px; gap: 14px; align-items: center; }
  .place-row .n { font-size: 15px; font-weight: 600; }
  .place-row .bar { height: 8px; border-radius: 999px; background: var(--surface3); overflow: hidden; }
  .place-row .bar div { height: 100%; border-radius: 999px; background: #8c7a4e; }
  .place-row.first .bar div { background: var(--gold); }
  .place-row .pct { font-size: 14px; color: var(--cream-dim); text-align: right; }
  .place-row .amt { font-size: 16px; font-weight: 600; text-align: right; }

  .tpl-save { display: flex; gap: 8px; flex-wrap: wrap; }
  .tpl-save input { flex: 1 1 280px; }
  .tpl-empty { border: 1px dashed var(--line-strong); border-radius: 20px; padding: 48px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  .tpl-empty h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .tpl-empty p { margin: 0; max-width: 420px; font-size: 14px; line-height: 1.5; color: var(--cream-dim); }
  .template-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px 12px 20px; }
  .template-row .name { flex: 1; font-size: 15px; font-weight: 600; }

  .journal-row { display: flex; align-items: flex-start; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  .journal-row:last-child { border-bottom: none; }
  .journal-time { flex: 0 0 72px; font-size: 13px; color: var(--cream-faint); padding-top: 2px; }
  .journal-main { flex: 1; min-width: 0; }
  .journal-action { font-size: 14px; font-weight: 600; }
  .journal-diff { font-size: 12px; margin-top: 2px; word-break: break-word; }
  .journal-device { flex: 0 0 auto; font-size: 12px; text-align: right; white-space: nowrap; }

  .voice-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 16px 24px; }
  .voice-row .text { flex: 1 1 320px; display: flex; flex-direction: column; gap: 2px; }
  .voice-row .text b { font-size: 15px; font-weight: 600; }
  .voice-row .text span { font-size: 13px; color: var(--cream-faint); }
  .voice-status { width: 100%; font-size: 13px; color: var(--cream-dim); }
  .voice-status:empty { display: none; }

  @media (max-width: 640px) {
    .timer-clock { font-size: 44px; min-width: 0; }
    .place-row { grid-template-columns: 72px minmax(0, 1fr) 96px; }
    .place-row .pct { display: none; }
    .badge { white-space: normal; }
  }
</style>
</head>

<script>
(function () {
  var P = window.P02L;
  var state = P.loadState();
  var tab = "timer";
  var templates = loadTemplates();
  var newTemplateName = "";
  var genCfg = { startSb: 25, growth: 50, duration: 20, count: 10, breakEvery: 4, breakDuration: 15, anteFromLevel: 4 };
  var voice = null;
  var voiceStatus = "";
  var voiceOn = false;
  var exactTimeInput = ""; // mm:ss field, kept as its own var so re-render doesn't clobber typing
  var PAUSE_REASONS = ["Разбор ситуации", "Технический перерыв", "Перерыв"];
  var journalState = { entries: [], total: 0, filter: "all", loading: false };
  var JOURNAL_TYPES = [["all","Все"],["timer","Таймер"],["cashdesk","Касса"],["tariff","Тарифы"],["levels","Уровни"],["prize","Призовые"],["settings","Настройки"]];

  // ---------- local template storage (separate from live state) ----------
  var TPL_KEY = "p02l_templates_v1";
  function loadTemplates() {
    try { return JSON.parse(localStorage.getItem(TPL_KEY) || "[]"); } catch (e) { return []; }
  }
  function saveTemplates(list) {
    templates = list;
    try { localStorage.setItem(TPL_KEY, JSON.stringify(list)); } catch (e) {}
  }

  function persist(next) {
    state = next;
    P.saveState(state);
    render();
  }

  // ---------- timer controls (server-authoritative, see server.js/timer-engine.js) ----------
  // status/levelIndex/remainingMs/endsAt no longer live in localStorage — the
  // timer client polls /api/timer and ticks locally off the server's clock.
  var timerClient = P.createTimerClient({ onUpdate: function () { render(); } });

  function start() { timerClient.start(); }
  function pause(reason) { timerClient.pause(reason); }
  function pauseWithReason(reason) { timerClient.pause(reason); }
  function dismissRecovered() { timerClient.dismissRecovered(); }

  // ---------- journal (append-only, server-side — see server.js/journal.js) ----------
  function fetchJournal() {
    journalState.loading = true;
    fetch("/api/journal?type=" + encodeURIComponent(journalState.filter) + "&limit=200")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        journalState.entries = data.entries;
        journalState.total = data.total;
        journalState.loading = false;
        if (tab === "journal") render();
      })
      .catch(function () { journalState.loading = false; });
  }
  function setJournalFilter(type) { journalState.filter = type; fetchJournal(); }
  function skip(dir) {
    var snap = timerClient.getSnapshot();
    if (!snap) return;
    var idx = Math.min(Math.max(snap.levelIndex + dir, 0), state.levels.length - 1);
    timerClient.setLevel(idx);
  }
  function resetClock() {
    timerClient.pause().then(function () { timerClient.setLevel(0); });
  }
  function adjustTime(deltaMs) { timerClient.adjust(deltaMs); }
  function parseMMSS(s) {
    var m = /^(\d{1,3}):([0-5]\d)$/.exec(String(s).trim());
    if (!m) return null;
    return (+m[1]) * 60 + (+m[2]);
  }
  function setExactTime() {
    var sec = parseMMSS(exactTimeInput);
    if (sec == null) { alert("Введите время как мм:сс, например 12:00"); return; }
    var snap = timerClient.getSnapshot();
    var lvl = snap ? state.levels[snap.levelIndex] : null;
    if (lvl && sec > lvl.duration * 60) {
      if (!confirm("Введённое время (" + P.mmss(sec) + ") больше длительности уровня (" + P.mmss(lvl.duration * 60) + "). Всё равно установить?")) return;
    }
    timerClient.setExact(sec);
  }
  function setExactTimeInput(v) { exactTimeInput = v; }
  function updateName(v) {
    var before = state.clubName;
    persist(Object.assign({}, state, { clubName: v }));
    P.logAction("settings", "Название клуба", before, v);
  }

  // ---------- levels ----------
  // level-duration sync to the server happens once, centrally, in the
  // P.subscribe callback at the bottom of this file (it fires synchronously
  // off persist() too) — covers edits from this window AND any other one
  function updateLevels(levels) { persist(Object.assign({}, state, { levels: levels })); }
  function setLevelField(id, field, val) {
    var before = state.levels.find(function (l) { return l.id === id; });
    var levels = state.levels.map(function (l) {
      if (l.id !== id) return l;
      var patch = {}; patch[field] = val;
      if (field === "sb") patch.bb = val * 2;
      return Object.assign({}, l, patch);
    });
    updateLevels(levels);
    P.logAction("levels", "Правка уровня (" + field + ")", before && before[field], val);
  }
  function removeLevel(id) {
    var removed = state.levels.find(function (l) { return l.id === id; });
    updateLevels(state.levels.filter(function (l) { return l.id !== id; }));
    P.logAction("levels", "Удалён уровень", removed, null);
  }
  function addLevel() {
    var last = null;
    for (var i = state.levels.length - 1; i >= 0; i--) if (!state.levels[i].isBreak) { last = state.levels[i]; break; }
    var sb = last ? P.roundBlind(last.sb * 1.5) : 25;
    var added = { id: P.uid(), sb: sb, bb: sb * 2, ante: 0, duration: last ? last.duration : 20, isBreak: false };
    updateLevels(state.levels.concat([added]));
    P.logAction("levels", "Добавлен уровень", null, added);
  }
  function addBreak() {
    var added = { id: P.uid(), sb: 0, bb: 0, ante: 0, duration: 15, isBreak: true };
    updateLevels(state.levels.concat([added]));
    P.logAction("levels", "Добавлен перерыв", null, added);
  }
  function moveLevel(idx, dir) {
    var j = idx + dir;
    if (j < 0 || j >= state.levels.length) return;
    var next = state.levels.slice();
    var tmp = next[idx]; next[idx] = next[j]; next[j] = tmp;
    updateLevels(next);
  }
  function runGenerator() {
    var out = [], sb = genCfg.startSb, n = 0;
    for (var i = 1; i <= genCfg.count; i++) {
      n++;
      var bb = sb * 2;
      var ante = (n >= genCfg.anteFromLevel && genCfg.anteFromLevel > 0) ? bb : 0;
      out.push({ id: P.uid(), sb: sb, bb: bb, ante: ante, duration: genCfg.duration, isBreak: false });
      if (genCfg.breakEvery > 0 && n % genCfg.breakEvery === 0 && i !== genCfg.count) {
        out.push({ id: P.uid(), sb: 0, bb: 0, ante: 0, duration: genCfg.breakDuration, isBreak: true });
      }
      sb = P.roundBlind(sb * (1 + genCfg.growth / 100));
    }
    var before = state.levels.length;
    updateLevels(out);
    P.logAction("levels", "Сгенерирована структура", before + " уровней", out.length + " уровней");
  }

  // ---------- cashdesk pricing / tariffs ----------
  // прices change daily, so the cashier screen (окно «Касса») stays locked
  // behind cashdesk.open until the admin reviews/edits today's tariffs here
  // and explicitly opens the desk — see toggleCashdeskOpen().
  function updateCashdesk(patch) { persist(Object.assign({}, state, { cashdesk: Object.assign({}, state.cashdesk, patch) })); }
  function toggleCashdeskOpen() {
    var opening = !state.cashdesk.open;
    updateCashdesk({ open: opening });
    P.logAction("cashdesk", opening ? "Касса открыта" : "Касса закрыта", !opening, opening);
  }
  function newCashdeskDay() {
    if (!confirm("Начать новый день? Счётчики кассы (входы, реентри, аддоны, выбывшие) и журнал обнулятся. Тарифы (названия/цены/стеки) останутся как сейчас — кассу придётся открыть заново.")) return;
    var before = { buyIns: state.cashdesk.buyIns, reEntries: state.cashdesk.reEntries, addons: state.cashdesk.addons, bustouts: state.cashdesk.bustouts };
    updateCashdesk({ buyIns: {}, reEntries: {}, addons: {}, bustouts: 0, log: [], open: false });
    P.logAction("cashdesk", "Начат новый день (счётчики кассы обнулены)", before, { buyIns: {}, reEntries: {}, addons: {}, bustouts: 0 });
  }
  function setTariffField(listKey, id, field, val) {
    var before = state.cashdesk[listKey].find(function (t) { return t.id === id; });
    var list = state.cashdesk[listKey].map(function (t) {
      if (t.id !== id) return t;
      var patch = {}; patch[field] = val;
      return Object.assign({}, t, patch);
    });
    var patch = {}; patch[listKey] = list;
    updateCashdesk(patch);
    P.logAction("tariff", "Правка тарифа (" + field + ")", before && before[field], val, before && before.label);
  }
  function addTariff(listKey, defaults) {
    var added = Object.assign({ id: P.uid() }, defaults);
    var patch = {}; patch[listKey] = state.cashdesk[listKey].concat([added]);
    updateCashdesk(patch);
    P.logAction("tariff", "Добавлен тариф", null, added);
  }
  // totalEntries/moneyCollected/avgStack (core.js) sum only over the CURRENT
  // tariff list — removing a tariff that already has counts would silently
  // drop its money/entries from the bank, avg stack and prize pool while the
  // orphaned counters stay in cd.buyIns/reEntries/addons, invisible in the UI.
  function tariffHasCounts(listKey, id) {
    var cd = state.cashdesk;
    if (listKey === "entryTariffs") return (cd.buyIns[id] || 0) > 0 || (cd.reEntries[id] || 0) > 0;
    return (cd.addons[id] || 0) > 0;
  }
  function removeTariff(listKey, id) {
    if (state.cashdesk[listKey].length <= 1) return; // always keep at least one tariff
    if (tariffHasCounts(listKey, id)) {
      alert("По этому тарифу уже есть продажи — удалить нельзя, иначе деньги и входы по нему молча пропадут из банка, среднего стека и призовых. Сначала «Начать новый день» (обнулит счётчики кассы), потом можно удалить тариф.");
      return;
    }
    var removed = state.cashdesk[listKey].find(function (t) { return t.id === id; });
    var patch = {}; patch[listKey] = state.cashdesk[listKey].filter(function (t) { return t.id !== id; });
    updateCashdesk(patch);
    P.logAction("tariff", "Удалён тариф", removed, null);
  }

  // ---------- prize ----------
  function updatePrize(patch) {
    var before = state.prize;
    persist(Object.assign({}, state, { prize: Object.assign({}, state.prize, patch) }));
    P.logAction("prize", "Правка призовых", before, patch);
  }

  // ---------- templates ----------
  function saveTemplate() {
    if (!newTemplateName.trim()) return;
    saveTemplates(templates.concat([{ id: P.uid(), name: newTemplateName.trim(), levels: state.levels }]));
    newTemplateName = "";
    render();
  }
  function loadTemplate(id) {
    var t = templates.find(function (x) { return x.id === id; });
    if (!t) return;
    var before = state.levels.length;
    updateLevels(t.levels.map(function (l) { return Object.assign({}, l, { id: P.uid() }); }));
    P.logAction("levels", "Загружен шаблон «" + t.name + "»", before + " уровней", t.levels.length + " уровней");
  }
  function deleteTemplate(id) {
    saveTemplates(templates.filter(function (t) { return t.id !== id; }));
    render();
  }

  // ---------- voice assistant ----------
  function setupVoice() {
    voice = P.createVoiceAssistant({
      lang: "ru-RU",
      commands: [
        { patterns: ["пауза", "стоп"], label: "Пауза", action: function () { var s = timerClient.getSnapshot(); if (s && s.status === "running") pause(); } },
        { patterns: ["старт", "продолжить", "начать"], label: "Старт", action: function () { var s = timerClient.getSnapshot(); if (s && s.status === "paused") start(); } },
        { patterns: ["следующий уровень", "вперёд", "вперед"], label: "Следующий уровень", action: function () { skip(1); } },
        { patterns: ["предыдущий уровень", "назад уровень"], label: "Предыдущий уровень", action: function () { skip(-1); } },
      ],
      onStatus: function (s) {
        if (s.state === "unsupported") voiceStatus = "Браузер не поддерживает распознавание речи.";
        else if (s.state === "listening") voiceStatus = "Слушаю… скажите «пауза», «старт», «следующий уровень»";
        else if (s.state === "heard") voiceStatus = "Услышал: «" + s.text + "»";
        else if (s.state === "matched") voiceStatus = "Выполнено: " + s.label;
        else if (s.state === "unmatched") voiceStatus = "Не распознал команду: «" + s.text + "»";
        else if (s.state === "error") voiceStatus = s.error === "network"
          ? "Ошибка сети — распознаванию речи в браузере нужен интернет, на офлайн-компьютере оно не будет работать."
          : s.error === "not-allowed" ? "Нет доступа к микрофону." : "Ошибка распознавания: " + s.error;
        else if (s.state === "stopped") voiceStatus = "Остановлено.";
        renderVoiceStatus();
      },
    });
  }
  function toggleVoice() {
    if (!voice) setupVoice();
    voiceOn = !voiceOn;
    if (voiceOn) voice.start(); else voice.stop();
    var btn = document.getElementById("voiceToggleBtn");
    if (btn) btn.setAttribute("aria-checked", voiceOn ? "true" : "false");
  }
  function renderVoiceStatus() {
    var el = document.getElementById("voiceStatusLine");
    if (el) el.textContent = voiceStatus;
  }

  // ---------- render ----------

  var ICONS = {

    doc: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:36px;height:36px;stroke-width:1.6;color:var(--cream-faint)"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>',
    mic: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--cream-dim)"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>',

  };

  function levelLabel(i) {
    var l = state.levels[i];
    if (!l) return "конец структуры";
    if (l.isBreak) return "Перерыв · " + l.duration + " мин";
    return "Уровень " + P.levelNumber(state.levels, i) + " · " + P.fmt(l.sb) + " / " + P.fmt(l.bb) + (l.ante ? " · анте " + P.fmt(l.ante) : "");
  }

  function render() {
    var snap = timerClient.getSnapshot();
    var level = snap ? (state.levels[snap.levelIndex] || null) : null;
    var remaining = snap ? timerClient.remainingSec() : 0;
    var running = !!snap && snap.status === "running";

    var html = '<header class="app-header">' +
      '<div class="app-header-left">' +
        '<img class="app-logo" src="data:image/png;base64,' + ICON_B64 + '" alt="">' +
        '<h1 class="page-title">Управление</h1>' +
        '<label class="name-field">Турнир<input type="text" value="' + esc(state.clubName) + '" onchange="updateName(this.value)"></label>' +
      '</div>' +
      '<div class="badge" title="Это окно и окна «TV», «Касса», «Призовые» должны быть открыты с этого же компьютера — данные (деньги/структура) синхронизируются локально через браузер. Часы таймера считает сервер (server.js) — он должен быть запущен."><span class="dot"></span>Синхронизация локально · TV, Касса, Призовые на этом ПК</div>' +
    '</header>';

    if (snap && snap.recovered) {
      html += '<section class="card" style="display:flex;align-items:center;gap:12px;border:1px solid var(--rust);">' +
        '<div style="flex:1;">Восстановлено после перезапуска: осталось ' + P.mmss(snap.recovered.remainingMs / 1000) + ' на уровне ' + (snap.recovered.levelIndex + 1) + '. Таймер стоит на паузе — проверьте и нажмите «Старт», когда будете готовы.</div>' +
        '<button class="pill-btn ghost small" onclick="dismissRecovered()">Понятно</button>' +
      '</section>';
    }

    html += '<section class="card timer-card" aria-label="Таймер">' +
      '<div class="sg timer-clock" id="statusTimer">' + (snap ? P.mmss(remaining) : "--:--") + '</div>' +
      '<div class="timer-info">' +
        '<div class="timer-state"><span class="dot ' + (running ? "" : "rust") + '"></span>' +
          (!snap ? "Нет связи с сервером" : running ? "Идёт" : "На паузе" + (snap.pauseReason ? " — " + esc(snap.pauseReason) : "")) + '</div>' +
        '<div class="timer-level sg">' + (level ? levelLabel(snap.levelIndex) : "Нет уровней") + '</div>' +
        (level ? '<div class="timer-next sg">Далее: ' + levelLabel(snap.levelIndex + 1) + '</div>' : "") +
      '</div>' +
      '<div class="timer-btns">' +
        '<button class="icon-btn" onclick="skip(-1)" aria-label="Предыдущий уровень" ' + (!snap || snap.levelIndex === 0 ? "disabled" : "") + '>' + ICONS.prev + '</button>' +
        (running
          ? '<button class="pill-btn rust main" onclick="pause()" ' + (!snap ? "disabled" : "") + '>' + ICONS.pause + 'Пауза</button>'
          : '<button class="pill-btn gold main" onclick="start()" ' + (!snap || !level ? "disabled" : "") + '>' + ICONS.play + 'Старт</button>') +
        '<button class="icon-btn" onclick="skip(1)" aria-label="Следующий уровень" ' + (!snap || snap.levelIndex >= state.levels.length - 1 ? "disabled" : "") + '>' + ICONS.next + '</button>' +
        '<button class="pill-btn ghost" onclick="resetClock()">Сброс</button>' +
      '</div>' +
      '<div class="timer-extra">' +
        '<span class="card-hint">Правка времени:</span>' +
        '<button class="pill-btn ghost small" onclick="adjustTime(-60000)">−1 мин</button>' +
        '<button class="pill-btn ghost small" onclick="adjustTime(-10000)">−10 с</button>' +
        '<button class="pill-btn ghost small" onclick="adjustTime(10000)">+10 с</button>' +
        '<button class="pill-btn ghost small" onclick="adjustTime(60000)">+1 мин</button>' +
        '<input type="text" placeholder="мм:сс" value="' + esc(exactTimeInput) + '" style="width:70px;" onchange="setExactTimeInput(this.value)">' +
        '<button class="pill-btn ghost small" onclick="setExactTime()">Установить</button>' +
      '</div>' +
      '<div class="timer-extra">' +
        '<span class="card-hint">Пауза с причиной:</span>' +
        PAUSE_REASONS.map(function (r) {
          return '<button class="pill-btn ghost small" onclick="pauseWithReason(\'' + esc(r) + '\')">' + ICONS.pauseSmall + esc(r) + '</button>';
        }).join("") +
      '</div>' +

    html += '<nav class="seg" aria-label="Разделы" style="align-self:flex-start;">';
    [["timer","Уровни блайндов"],["cashdesk","Касса и суммы"],["prize","Призовые"],["templates","Шаблоны"],["journal","Журнал"]].forEach(function (t) {

    });
    html += '</nav>';

    html += '<div class="tab-body">';
    if (tab === "timer") html += renderLevelsTab();
    if (tab === "cashdesk") html += renderCashdeskTab();
    if (tab === "prize") html += renderPrizeTab();
    if (tab === "templates") html += renderTemplatesTab();

      '<button class="switch" id="voiceToggleBtn" role="switch" aria-checked="' + (voiceOn ? "true" : "false") + '" aria-label="Голосовое управление" onclick="toggleVoice()"></button>' +
      '<div class="voice-status" id="voiceStatusLine">' + esc(voiceStatus) + '</div>' +
    '</section>';

    document.getElementById("root").innerHTML = html;
  }

  function renderLevelsTab() {
    var html = '<section class="card">' +
      '<div class="card-head"><h2 class="card-title">Генератор структуры</h2><span class="card-hint">задайте параметры — сетка уровней построится целиком</span></div>' +

    html += '<div class="lv-add">' +
      '<button class="pill-btn ghost small" onclick="addLevel()">+ Уровень</button>' +

  function genField(label, key, val) {

  }

  function renderCashdeskTab() {
    var cd = state.cashdesk;
    var html = '<section class="card cash-status">' +
      '<div class="text">' +

        '<span class="muted" style="font-size:14px;">' + (cd.open ? "Кассир может принимать входы, реентри и аддоны" : "Проверьте тарифы и откройте кассу — до этого окно «Касса» заблокировано") + '</span>' +

      '<button class="pill-btn ghost small" onclick="newCashdeskDay()">Начать новый день</button>' +

    html += '<section class="card tariff-card">' +

    html += '<button class="pill-btn ghost small" onclick="addTariff(\'entryTariffs\',{label:\'Повышенный стек\',price:5000,stack:20000})">+ Тариф входа</button>' +
    '</section>';

    html += '<section class="card tariff-card">' +
      '<div class="card-head" style="flex-direction:column;align-items:flex-start;gap:4px;"><h2 class="card-title">Тарифы аддона</h2><span class="card-hint">Например, обычный и двойной аддон</span></div>' +
      '<div class="tf-grid tf-head"><span>НАЗВАНИЕ</span><span>ЦЕНА, ₽</span><span>ФИШЕК</span><span></span></div>';
    cd.addonTariffs.forEach(function (t) {
      html += tariffRow("addonTariffs", t, "chips", cd.addonTariffs.length <= 1, tariffHasCounts("addonTariffs", t.id));
    });
    html += '<button class="pill-btn ghost small" onclick="addTariff(\'addonTariffs\',{label:\'Двойной аддон\',price:4000,chips:20000})">+ Тариф аддона</button>' +
    '</section>';

    var bank = P.moneyCollected(state);
    html += '<section class="card rake-card">' +
      settingField("Рейк, %", "rake", cd.rake, "updateCashdesk") +
      '<div class="calc">С банка <b class="sg">' + P.fmt(bank) + ' ₽</b> клуб удерживает <b class="sg">' + P.fmt(bank * cd.rake / 100) + ' ₽</b>, в призовой фонд идёт <b class="sg gold">' + P.fmt(P.prizePoolAuto(state)) + ' ₽</b></div>' +
    '</section>';

    html += '<p class="card-hint" style="margin:0;">Прежде чем открывать клуб на сегодня, проверьте тарифы и нажмите «Открыть кассу на сегодня» — до этого окно «Касса» показывает замок и не даёт принимать деньги. Сами клики по входам, реентри, аддонам и выбывшим делаются в окне «Касса».</p>';
    return html;
  }
  function tariffRow(listKey, t, chipsKey, isLast, hasCounts) {
    var html = '<div class="tf-grid tf-row">' +
      '<input type="text" aria-label="Название тарифа" value="' + esc(t.label) + '" onchange="setTariffField(\'' + listKey + '\',\'' + t.id + '\',\'label\',this.value)">' +
      '<input type="number" aria-label="Цена, ₽" value="' + t.price + '" onchange="setTariffField(\'' + listKey + '\',\'' + t.id + '\',\'price\',+this.value)">' +
      '<input type="number" aria-label="Фишек" value="' + t[chipsKey] + '" onchange="setTariffField(\'' + listKey + '\',\'' + t.id + '\',\'' + chipsKey + '\',+this.value)">' +
      '<div class="tf-side">';
    if (hasCounts) {
      html += '<span class="sold-pill">' + ICONS.lock + 'есть продажи</span>';
    } else if (!isLast) {
      html += '<button class="row-btn danger" aria-label="Удалить тариф" onclick="removeTariff(\'' + listKey + '\',\'' + t.id + '\')">' + ICONS.trash + '</button>';
    }
    html += '</div></div>';
    return html;
  }
  function settingField(label, key, val, fnName) {
    return '<label class="field">' + label + '<input type="number" value="' + val + '" onchange="' + fnName + '({' + key + ':+this.value})"></label>';
  }

  function renderPrizeTab() {
    var pz = state.prize;
    var auto = P.prizePoolAuto(state);
    var breakdown = P.payoutBreakdown(state);
    var html = '<div class="prize-layout">';

    html += '<section class="card prize-left">' +
      '<h2 class="card-title">Призовой фонд</h2>' +
      '<div class="seg fill">' +
        '<button class="seg-btn ' + (pz.mode === "auto" ? "active" : "") + '" aria-pressed="' + (pz.mode === "auto") + '" onclick="updatePrize({mode:\'auto\'})">Авто</button>' +
        '<button class="seg-btn ' + (pz.mode === "manual" ? "active" : "") + '" aria-pressed="' + (pz.mode === "manual") + '" onclick="updatePrize({mode:\'manual\'})">Вручную</button>' +
      '</div>';
    if (pz.mode === "auto") {
      html += '<div style="display:flex;flex-direction:column;gap:6px;">' +
        '<div class="sg fund-val">' + P.fmt(auto) + ' ₽</div>' +
        '<div class="muted" style="font-size:14px;">касса ' + P.fmt(P.moneyCollected(state)) + ' ₽ минус рейк ' + state.cashdesk.rake + '%</div>' +
      '</div>';
    } else {
      html += '<label class="field">Сумма, ₽<input type="number" value="' + pz.manualTotal + '" style="height:56px;font-size:24px;font-weight:600;" onchange="updatePrize({manualTotal:+this.value})"></label>';
    }
    html += '<div class="divider" style="height:1px;background:var(--line);"></div>' +
      '<label class="field">Примечание для TV-экрана' +
        '<textarea rows="3" placeholder="Например: 1 место + билет на главное событие" onchange="updatePrize({note:this.value})">' + esc(pz.note) + '</textarea>' +
      '</label>' +
    '</section>';

    html += '<section class="card prize-right">' +
      '<div class="card-head" style="margin-bottom:0;"><h2 class="card-title">Распределение по местам</h2><span class="card-hint">таблица Olympic Poker Club · ' + P.paidEntries(state) + ' входов (реентри не увеличивают сетку)</span></div>';
    if (breakdown.length === 0) {
      html += '<div class="muted" style="font-size:14px;">Нет входов — нечего распределять.</div>';
    } else {
      var maxPct = breakdown[0].pct;
      breakdown.forEach(function (p) {
        html += '<div class="place-row' + (p.place === 1 ? " first" : "") + '">' +
          '<span class="n">' + p.place + ' место</span>' +
          '<div class="bar"><div style="width:' + (p.pct / maxPct * 100) + '%;"></div></div>' +
          '<span class="pct sg">' + String(p.pct).replace(".", ",") + '%</span>' +
          '<span class="amt sg">' + P.fmt(p.amount) + ' ₽</span>' +
        '</div>';
      });
    }
    html += '</section></div>';
    return html;
  }

  function renderTemplatesTab() {
    var html = '<section class="card"><div class="card-head"><h2 class="card-title">Сохранить текущую структуру</h2><span class="card-hint">' + state.levels.length + ' уровней в текущей сетке</span></div>' +
      '<div class="tpl-save">' +
        '<input type="text" id="tplNameInput" placeholder="Название шаблона, напр. «Турбо пятница»" value="' + esc(newTemplateName) + '" onchange="setTplName(this.value)">' +
        '<button class="pill-btn gold small" onclick="saveTemplate()">Сохранить</button>' +
      '</div></section>';
    if (templates.length === 0) {
      html += '<div class="tpl-empty">' + ICONS.doc +
        '<h2>Пока нет шаблонов</h2>' +
        '<p>Сохраните текущие уровни как шаблон, чтобы в следующий раз загрузить структуру в один клик.</p>' +
      '</div>';
    } else {
      templates.forEach(function (t) {
        html += '<div class="card template-row">' +
          '<div class="name">' + esc(t.name) + '</div>' +
          '<div class="muted" style="font-size:13px;">' + t.levels.length + ' уровней</div>' +
          '<button class="pill-btn ghost small" onclick="loadTemplate(\'' + t.id + '\')">Загрузить</button>' +
          '<button class="row-btn danger" aria-label="Удалить шаблон" onclick="deleteTemplate(\'' + t.id + '\')">' + ICONS.trash + '</button>' +
        '</div>';
      });
    }
    return html;
  }

  function formatJournalVal(v) {
    if (v == null) return "—";
    if (typeof v === "object") {
      return Object.keys(v).map(function (k) { return k + ": " + JSON.stringify(v[k]); }).join(", ") || "—";
    }
    return String(v);
  }
  function renderJournalTab() {
    var html = '<section class="card" style="display:flex;flex-direction:column;gap:14px;">' +
      '<div class="card-head"><h2 class="card-title">Журнал действий</h2><span class="card-hint">' + journalState.total + ' запис' + (journalState.total % 10 === 1 && journalState.total % 100 !== 11 ? "ь" : journalState.total % 10 >= 2 && journalState.total % 10 <= 4 && (journalState.total % 100 < 12 || journalState.total % 100 > 14) ? "и" : "ей") + ' всего · только добавление, ничего нельзя удалить или изменить</span></div>' +
      '<div class="seg">';
    JOURNAL_TYPES.forEach(function (t) {
      html += '<button class="seg-btn ' + (journalState.filter === t[0] ? "active" : "") + '" aria-pressed="' + (journalState.filter === t[0]) + '" onclick="setJournalFilter(\'' + t[0] + '\')">' + t[1] + '</button>';
    });
    html += '</div></section>';

    html += '<section class="card table-card" style="padding:0;">';
    if (journalState.entries.length === 0) {
      html += '<div class="muted" style="padding:24px;font-size:14px;">Записей пока нет.</div>';
    } else {
      journalState.entries.forEach(function (e) {
        var t = new Date(e.at);
        var time = String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0") + ":" + String(t.getSeconds()).padStart(2,"0");
        html += '<div class="journal-row">' +
          '<div class="journal-time sg">' + time + '</div>' +
          '<div class="journal-main">' +
            '<div class="journal-action">' + esc(e.action) + (e.reason ? ' <span class="muted">· ' + esc(String(e.reason)) + '</span>' : '') + '</div>' +
            '<div class="journal-diff sg muted">' + esc(formatJournalVal(e.before)) + ' &rarr; ' + esc(formatJournalVal(e.after)) + '</div>' +
          '</div>' +
          '<div class="journal-device muted">' + esc(e.device) + '</div>' +
        '</div>';
      });
    }
    html += '</section>';
    return html;
  }

  // expose handlers
  window.setTab = function (t) { tab = t; if (t === "journal") fetchJournal(); render(); };
  window.setJournalFilter = setJournalFilter;
  window.updateName = updateName;
  window.start = start; window.pause = pause; window.pauseWithReason = pauseWithReason; window.skip = skip; window.resetClock = resetClock;
  window.adjustTime = adjustTime; window.setExactTime = setExactTime; window.setExactTimeInput = setExactTimeInput;
  window.dismissRecovered = dismissRecovered;
  window.setLevelField = setLevelField; window.removeLevel = removeLevel; window.addLevel = addLevel; window.addBreak = addBreak; window.moveLevel = moveLevel;
  window.setGenField = function (key, val) { genCfg[key] = val; };
  window.runGenerator = runGenerator;
  window.updateCashdesk = updateCashdesk;
  window.toggleCashdeskOpen = toggleCashdeskOpen; window.newCashdeskDay = newCashdeskDay;
  window.setTariffField = setTariffField; window.addTariff = addTariff; window.removeTariff = removeTariff;
  window.updatePrize = updatePrize;
  window.setTplName = function (v) { newTemplateName = v; };
  window.saveTemplate = saveTemplate; window.loadTemplate = loadTemplate; window.deleteTemplate = deleteTemplate;
  window.toggleVoice = toggleVoice;

  // only the status-bar countdown ticks every 250ms — a full render() would
  // rebuild every input and throw focus out of whatever field is being edited.
  // Reads the timer client's already-offset-corrected clock, no decrementing
  // counter of its own (per spec: client never owns the countdown math).
  function tickStatusBar() {
    var snap = timerClient.getSnapshot();
    var el = document.getElementById("statusTimer");
    if (el && snap) el.textContent = P.mmss(timerClient.remainingSec());
  }

  var lastSyncedLevels = null;
  P.subscribe(function (s) {
    state = s;
    render();
    // another window may have edited the blind structure — keep the
    // server's duration list in sync regardless of who changed it
    var key = JSON.stringify(s.levels.map(function (l) { return l.duration; }));
    if (key !== lastSyncedLevels) {
      lastSyncedLevels = key;
      timerClient.syncLevels(s.levels);
    }
  });
  lastSyncedLevels = JSON.stringify(state.levels.map(function (l) { return l.duration; }));
  timerClient.syncLevels(state.levels); // bootstrap: server starts with no duration info at all
  setInterval(tickStatusBar, 250);
  setInterval(function () { if (tab === "journal" && !journalState.loading) fetchJournal(); }, 4000);
  render();
})();
</script>
</body>
</html>
